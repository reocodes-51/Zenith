<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zenith Todo App</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
        <div class="container">

            <header>
                <h1>Zenith</h1>
                <p>Organize your day effectively</p>
            </header>

            <section class="task-input">

                <input
                type="text"
                id="taskInput"
                placeholder="Please enter a new task ...."
                >

                <button id="addBtn">
                    Add Task
                </button>

            </section>

            <section class="search-section">

                <input 
                type="text"
                id="searchInput"
                placeholder="Search tasks"
                >
            </section>

            <section class="filters">
                <button id="allBtn">All</button>
                <button id="pendingBtn">Pending</button>
                <button id="completeBtn">Completed</button>
            </section>

            <section>
                <ul id="taskList">
                    <!-- Tasks will be added here using JavaScript -->
                </ul>
            </section>

             <footer>

            <p>Total Tasks : <span id="totalTasks">0</span></p>
            <p>Completed : <span id="completedTasks">0</span></p>
            <p>Remaining : <span id="remainingTasks">0</span></p>

        </footer>

        </div>

        <script src="js/script.js"></script>
</body>
</html>
